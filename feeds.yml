# 「jz的分身」订阅源配置
#
# 只收两类内容:
#   type: blog       行业大 V 的个人博客(署名个人,不是机构或媒体)
#   type: interview  对这些人的深度访谈(访谈类播客、访谈型 newsletter)
#
# 地址三选一:
#   url           直接写 RSS 地址
#   apple_id      Apple Podcasts 的节目 ID,抓取时自动换成 RSS 地址
#   apple_search  Apple Podcasts 上的节目名,自动搜索并取第一个结果
#                 (解析到的节目名会记进 data/health.json,可核对有没有匹配错)
#
# 播客的 RSS 地址托管方五花八门,靠猜命中率很低,所以走 Apple 的公开接口解析。
#
# enabled: false 可停用而不删除。

feeds:
  # ======================= 个人博客 =======================
  # 以下 14 个均已在实际抓取中验证可用

  - name: Stratechery
    url: https://stratechery.com/feed/
    type: blog
    lang: en
    author: Ben Thompson
    tags: [战略, 科技商业]
    note: 部分内容付费墙,RSS 通常只给免费文章

