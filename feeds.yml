# 「jz的分身」订阅源配置
#
# 字段说明:
#   name     显示名
#   url      RSS/Atom 地址
#   lang     zh | en
#   author   作者/机构(用于页面筛选)
#   tags     标签,用于分类
#   enabled  false 可临时停用而不删除
#
# 注意: 下面的 URL 无法在开发容器里联网验证(网络策略限制),
# 首次 Actions 跑完后看 data/health.json,把连续失败的源修掉或停用。

feeds:
  # ---------- 英文:科技/商业战略分析 ----------
  - name: Stratechery
    url: https://stratechery.com/feed/
    lang: en
    author: Ben Thompson
    tags: [战略, 科技商业]
    note: 部分内容付费墙,RSS 通常只给免费周一篇

  - name: Benedict Evans
    url: https://www.ben-evans.com/benedictevans?format=rss
    lang: en
    author: Benedict Evans
    tags: [战略, 科技趋势]

  - name: Not Boring
    url: https://www.notboring.co/feed
    lang: en
