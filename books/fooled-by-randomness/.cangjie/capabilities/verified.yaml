- capability_id: cap.fooled-by-randomness.information-diet
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: information-diet
  title: 降低查看频率与信息节食
  importance: high
  importance_rationale: T08；第3章退休牙医给出可复算数值，第11、12章补充噪声过滤与门槛式查看
  one_liner: 看得越勤，看到的越是噪声：用 Φ((μ/σ)√Δt) 算出每个频率'看到赚钱'的概率，再定查看频率和信息源。
  intents:
