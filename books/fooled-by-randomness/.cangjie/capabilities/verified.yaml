schema_version: 1
bundle_id: bundle.fooled-by-randomness
book:
  title: 《随机漫步的傻瓜》(Fooled by Randomness)
  author: 纳西姆·尼古拉斯·塔勒布（中译本，中信出版社）
  source_pack: books/fooled-by-randomness
entry:
  name: fooled-by-randomness
  description: '当用户询问《随机漫步的傻瓜》(Fooled by Randomness, 塔勒布) 相关内容，或在以下场景需要判断运气与风险时调用:

    投资(这收益是运气还是能力/胜率与期望值/杠杆与爆仓/稳定高收益是否藏雷/基金榜单与回测/推销产品/止损与被套/看盘焦虑)、

    职业选择(复盘当初的选择/跟成功前辈学什么/该不该跳槽或坚持/同辈攀比)、日常决策(概率与检测结果/新闻统计/冲动控制/选择困难/逆境自处)。

    不适用于: 具体标的买卖建议与价格预测、税务法律医疗诊断、心理危机干预。

    Triggers: 随机漫步的傻瓜/塔勒布/Taleb/运气还是能力/幸存者偏差/黑天鹅/期望值/止损/爆仓/Fooled by Randomness'
  core_principles:
  - 成功先默认放进'运气'栏：行业随机成分越大、参与者越多，纯运气造出的明星越多。
  - 评价决定看所有可能的历史，不看实际发生的那一条；同样的钱有不同的'质量'。
  - 失败代价承受不起时，成功概率多高都无关紧要；生存优先于收益。
  - 看期望值（概率×结果）不看胜率；长期平稳的高收益可能藏着一次清零。
  - 数据只用来否证不用来证实：下注前写好'我错了的信号'，到点认错，敢于改主意。
  - 看得越勤看到的越是噪声；人脑天生概率盲，靠环境设计而非意志力自保，厄运中守住举止。
  out_of_scope:
  - 具体股票/基金/币种的买卖建议、价格或点位预测
  - 税务、法律、医疗诊断与治疗决定（只做概率思维辅助，结论交给专业人士）
  - 心理危机、自伤风险（先求助专业人士或紧急热线）
  stop_conditions:
  - 意图在路由表与能力索引中均无法命中 → 明确告知超出本书范围，不硬套书中框架。
  - 用户要求直接给出买卖指令或收益承诺 → 停止，改为提供检查框架并说明不构成投资建议。
  - 涉及医疗/法律/人身安全 → 停止套用方法论，建议专业求助。
  - 纯事实查询（书名/作者/章节/术语）→ 用核心原则、overview 与 glossary 回答后即停。
